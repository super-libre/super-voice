[package]
    name = "super-voice-app-core"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "What Super Voice's apps share, with no UI library: the daemon client, state, notes and clips, and audio"
    repository = "https://github.com/super-libre/super-voice"
    license = "GPL-3.0-only"

# No UI library here, on purpose. Each app (libcosmic on Linux today) draws on
# top of this crate, so whatever lands here has to work for all of them.
[dependencies]
    # A note or clip is named for the time it was made.
    chrono.workspace = true
    # Microphone capture for cloned-voice reference recordings, and clip
    # playback. Speech the user asks for still plays through the daemon.
    cpal.workspace = true
    futures-util.workspace = true
    # Clips are WAV files, and so are the recordings.
    hound.workspace = true
    log.workspace = true
    serde.workspace = true
    serde_json.workspace = true
    # What a backend says it supports, for the rules behind the capability chips.
    super-voice-registry-types = { path = "../super-voice-registry-types" }
    super-voice-shared = { path = "../super-voice-shared" }
    tokio.workspace = true
    urlencoding = "2.1.3"

[dev-dependencies]
    # The `v1/` wrapper tests drive each call against a fake daemon served on a
    # Unix socket (see `daemon/client/tests/fake_daemon.rs`), so the request the
    # wrapper actually builds is the thing under test. Same HTTP stack the real
    # daemon serves with.
    http-body-util = "0.1"
    hyper = { version = "1", features = ["http1", "server"] }
    hyper-util = { version = "0.1", features = ["tokio"] }
    # The path and response-key contract tests check the client against the
    # OpenAPI document the daemon builds from its router. Taken from the crate
    # rather than a file so the tests need nothing generated first.
    super-voice-daemon = { path = "../super-voice-daemon" }
    # Test folders for the notes and clips, which remove themselves.
    tempfile = "3.27.0"

[lints]
    workspace = true
