[package]
    name = "super-voice-app-core"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "What the Super Voice app draws, with no UI library: the daemon client, state, page logic, notes and clips, and audio"
    repository = "https://github.com/super-libre/super-voice"
    license = "GPL-3.0-only"

# No UI library here, on purpose. The app (GPUI, in super-voice-gpui) draws on
# top of this crate; what lands here is logic, kept apart from the drawing.
[dependencies]
    # The Fluent catalogs every app reads its words from. `fluent` at the
    # version i18n-embed uses, for the values a lookup is given.
    fluent = "0.17.0"
    i18n-embed.workspace = true
    rust-embed.workspace = true
    # A note or clip is named for the time it was made.
    chrono.workspace = true
    # Microphone capture for cloned-voice reference recordings, and clip
    # playback. Speech the user asks for still plays through the daemon.
    cpal.workspace = true
    futures-util.workspace = true
    # Clips are WAV files, and so are the recordings.
    hound.workspace = true
    log.workspace = true
    serde.workspace = true
    serde_json.workspace = true
    # What a backend says it supports, for the rules behind the capability chips.
    super-voice-registry-types = { path = "../super-voice-registry-types" }
    super-voice-shared = { path = "../super-voice-shared" }
    # The self-updater downloads the installer with the engine's HTTP client.
    super-engine-forge.workspace = true
    tokio.workspace = true
    urlencoding = "2.1.3"

# The daemon's launchd target names the user's id.
[target.'cfg(target_os = "macos")'.dependencies]
    libc.workspace = true

[dev-dependencies]
    # The `v1/` wrapper tests drive each call against a fake daemon served on a
    # Unix socket (see `daemon/client/tests/fake_daemon.rs`), so the request the
    # wrapper actually builds is the thing under test. Same HTTP stack the real
    # daemon serves with.
    http-body-util = "0.1"
    hyper = { version = "1", features = ["http1", "server"] }
    hyper-util = { version = "0.1", features = ["tokio"] }
    # The path and response-key contract tests check the client against the
    # OpenAPI document the daemon builds from its router. Taken from the crate
    # rather than a file so the tests need nothing generated first.
    super-voice-daemon = { path = "../super-voice-daemon" }
    # A fake release server for the self-updater's download.
    mockito = "1.7.2"
    # Test folders for the notes and clips, which remove themselves.
    tempfile = "3.27.0"

[lints]
    workspace = true
