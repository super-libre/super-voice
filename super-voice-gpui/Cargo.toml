[package]
    name = "super-voice-gpui"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "The Super Voice app, on GPUI with gpui-kit"
    repository = "https://github.com/super-libre/super-voice"
    license = "GPL-3.0-only"
    publish = false

# The app's binary keeps the name the app has always had. The daemon trusts a
# client by that name beside it, runs it for its banners on macOS
# (`super-voice-app --notify`), and starts it after an update; the desktop
# entry, the icon and the COSMIC applet's launch button name it too.
[[bin]]
    name = "super-voice-app"
    path = "src/main.rs"

[features]
    # `super-voice-app --shot`: the window drawn off screen into a PNG
    # (`just app-shot`, src/shot.rs). It needs GPUI's headless renderer, which
    # comes with the kit's test support, so release builds leave it out.
    screenshot = ["dep:image", "dep:serde_json", "gpui-kit/test-support"]
    # Hot-patching while developing: `just app-watch` (src/hot.rs).
    hotpatch = ["dep:dioxus-devtools", "dep:subsecond"]

[dependencies]
    # The UI: GPUI, which gpui-kit re-exports, and the kit's components.
    #
    # 0.11.0 (2026-11-23) is the newest release, and it pins GPUI exactly:
    # `gpui-pre =0.3.14`, Longbridge's weekly snapshot of Zed's crates/gpui
    # (Zed publishes none). Pinned exactly here too, since most of the kit's
    # weekly releases break something small: bump on purpose, with its
    # release notes, never by `cargo update`. It needs Rust 1.92 or newer.
    #
    # Default features: components, the default Lucide icons, and X11 beside
    # Wayland on Linux, which the app before this one had too.
    gpui-kit = "=0.11.0"
    # Reading the daemon's event stream (src/daemon_events.rs).
    futures-util.workspace = true
    # The desktop's languages, for the words (the catalogs are the core's).
    i18n-embed.workspace = true
    log.workspace = true
    # The daemon client and the logic of every page, which the app draws.
    super-voice-app-core = { path = "../super-voice-app-core" }
    super-voice-shared = { path = "../super-voice-shared" }
    # The core's async work runs on a runtime of its own (src/runtime.rs).
    tokio.workspace = true

    anyhow.workspace = true
    # For the screenshot binary: the image crate GPUI's screenshots are made
    # with, to save one as a PNG.
    image = { version = "0.25", default-features = false, features = ["png"], optional = true }
    # For the screenshot binary: a made-up download's progress, as the daemon
    # sends one.
    serde_json = { workspace = true, optional = true }
    # For `hotpatch`: Dioxus's hot-patching engine, and its link to `dx serve`.
    # At the version of the `dx` that serves the patches, which `just
    # app-watch` checks: a patch from another version does not apply.
    dioxus-devtools = { version = "=0.7.10", optional = true }
    subsecond = { version = "=0.7.10", optional = true }

[dev-dependencies]
    # Reads the built-in theme file in a test.
    serde_json.workspace = true

# `--notify`: posting the daemon's banners as Super Voice
# (src/macos/notifier.rs).
# objc2 and its framework crates at the versions GPUI's macOS platform
# already builds.
[target.'cfg(target_os = "macos")'.dependencies]
    block2 = "0.6"
    objc2 = "0.6"
    objc2-app-kit.version = "0.3"
    objc2-app-kit.default-features = false
    objc2-app-kit.features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"]
    objc2-foundation.version = "0.3"
    objc2-foundation.default-features = false
    objc2-foundation.features = ["std", "block2", "NSBundle", "NSError", "NSString"]
    objc2-user-notifications.version = "0.3"
    objc2-user-notifications.default-features = false
    objc2-user-notifications.features = [
        "std",
        "block2",
        "UNNotificationContent",
        "UNNotificationRequest",
        "UNNotificationSettings",
        "UNNotificationTrigger",
        "UNUserNotificationCenter",
    ]

[lints]
    workspace = true
