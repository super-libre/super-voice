[package]
    name = "super-voice-app"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Super Voice settings app"
    repository = "https://github.com/super-libre/super-voice"
    license = "GPL-3.0-only"

[dependencies]
    anyhow.workspace = true
    # The Updates page shows when the daemon last checked in local time.
    chrono.workspace = true
    dirs.workspace = true
    futures-util.workspace = true
    hound.workspace = true
    i18n-embed.workspace = true
    i18n-embed-fl.workspace = true
    # The press guard hands on its content's accessibility tree.
    iced_accessibility.workspace = true
    libc.workspace = true
    # Dotted keys, not an inline table: `fluent_language_loader!` parses this
    # manifest with a TOML 1.0 parser, which rejects a multi-line inline table.
    libcosmic.workspace = true
    libcosmic.features = [
        "default",
        "a11y",
        "applet",
        "dbus-config",
        "multi-window",
        "single-instance",
        "tokio",
        "wayland",
        "wgpu",
        "winit",
    ]
    log.workspace = true
    open.workspace = true
    rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
    serde.workspace = true
    serde_json.workspace = true
    # Cosmic settings dependencies
    slab = "0.4"
    slotmap = "1.1"
    strum.workspace = true
    strum_macros.workspace = true
    super-engine-forge.workspace = true
    # The daemon client and the types it reads, shared by every app.
    super-voice-app-core = { path = "../super-voice-app-core" }
    super-voice-registry-types = { path = "../super-voice-registry-types" }
    # Workspace dependencies
    super-voice-shared = { path = "../super-voice-shared" }
    tokio.workspace = true
    uuid.workspace = true

[build-dependencies]
    vergen.workspace = true

[features]
    default = []

[dev-dependencies]
    mockito = "1.7.2"
    # Test directories that remove themselves.
    tempfile = "3.27.0"

[lints]
    workspace = true
