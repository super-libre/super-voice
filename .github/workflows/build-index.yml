# SPDX-License-Identifier: GPL-3.0-only
name: Build registry index

# The job is super-engine's. It is pinned at the same
# rev as the super-engine crates in Cargo.toml.

on:
  schedule:
    - cron: '0 */6 * * *'    # every 6 hours
  push:
    branches: [main]
    paths: ['registry/registry.toml', 'super-voice-registry-types/**']
  workflow_dispatch:

permissions:
  contents: write   # to push to gh-pages branch

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    uses: super-libre/super-engine/.github/workflows/build-index.yml@b565b31a1b8770ebda283a5e7ca899c86ff75070
    with:
      indexer: super-voice-indexer
      registry-types: super-voice-registry-types

  # Released installs read the index from jorge-menjivar.github.io, where
  # this repo's Pages site was: GitHub doesn't redirect a renamed or moved
  # repo's site. Super STT reads it under /super-stt/, from before the repo
  # became super-voice. Super Voice betas from before the move to super-libre
  # read it under /super-voice/. The user site
  # jorge-menjivar/jorge-menjivar.github.io serves copies at both, and this
  # job keeps them in step with the ones just published. Its deploy key is the
  # SUPER_STT_PAGES_DEPLOY_KEY secret.
  mirror:
    needs: build
    if: github.repository == 'super-libre/super-voice'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          sparse-checkout: |
            index.json
            backend.schema.json
            registry.schema.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v7
        with:
          repository: jorge-menjivar/jorge-menjivar.github.io
          ssh-key: ${{ secrets.SUPER_STT_PAGES_DEPLOY_KEY }}
          path: mirror
      - name: Copy the index and schemas to super-stt/ and super-voice/
        run: |
          for dir in super-stt super-voice; do
            mkdir -p "mirror/$dir"
            cp site/index.json site/backend.schema.json site/registry.schema.json "mirror/$dir/"
          done
          cd mirror
          git add super-stt super-voice
          if git diff --cached --quiet; then
            echo "The copies are current."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Copy Super Voice's index and schemas ($GITHUB_SHA)"
          git push origin HEAD
