[package]
    name = "super-voice-ffi"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "super-voice-app-core for apps written in other languages, through UniFFI"
    repository = "https://github.com/super-libre/super-voice"
    license = "GPL-3.0-only"

# `staticlib` is what the SwiftUI app links. `cdylib` is what `uniffi-bindgen`
# reads the exported interface from (`--library`). `lib` keeps the crate
# usable from Rust, for the bindgen binary and the tests.
[lib]
    crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
    name = "uniffi-bindgen"
    path = "src/bin/uniffi-bindgen.rs"

[dependencies]
    # Note times go out as seconds since 1970, read in local time.
    chrono.workspace = true
    futures-util.workspace = true
    super-voice-app-core = { path = "../super-voice-app-core" }
    super-voice-shared = { path = "../super-voice-shared" }
    # The stores run their work on a runtime of their own.
    tokio.workspace = true
    # `cli`: the bindgen binary.
    uniffi = { version = "0.32.2", features = ["cli"] }

[dev-dependencies]
    # A backend for the Configure sheet's tests, as the daemon lists it.
    serde_json.workspace = true

[lints]
    workspace = true
